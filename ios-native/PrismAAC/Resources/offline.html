<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Prism AAC — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#14161d;color:#fff;font-family:-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0;overflow-x:hidden}
.bar{background:#1e2030;border-radius:12px;padding:14px 16px;margin:8px 12px;font-size:20px;min-height:52px;display:flex;align-items:center;gap:8px}
.bar span{flex:1}
.bar .speak{background:#4CAF50;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;gap:4px;padding:4px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#1e2030;border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tab.active{background:#4a3f8a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px;overflow-y:auto;max-height:calc(100vh - 180px)}
.tile{background:#1e2030;border-radius:12px;padding:12px 6px;text-align:center;font-size:15px;cursor:pointer;border:none;color:#fff;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile:active{background:#2a3050}
.tile .e{font-size:28px}
.sos{display:block;width:calc(100% - 24px);margin:6px 12px;min-height:56px;background:#dc2626;color:#fff;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer}
.note{margin:4px 12px;padding:10px 12px;border-radius:10px;background:#3a2a10;color:#ffd58a;font-size:14px;line-height:1.35}
.foot{text-align:center;padding:8px;font-size:12px;opacity:0.35}
.foot button{background:#2a3050;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;margin-bottom:4px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="bar">
  <span id="msg" style="opacity:0.5">Tap a phrase to speak</span>
  <button class="speak" onclick="speakBar()">Speak ▶</button>
</div>
<button class="sos" id="sos" aria-label="Emergency: say the call for help aloud" onclick="toggleSos()">🚨 Emergency</button>
<div class="note" id="note" hidden>Prism AAC needs a trial or subscription. The Help / Needs phrases always work. Your boards come back when you reconnect.</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="foot">
  <button onclick="location.href='prism-aac-reconnect://app'">🔄 Reconnect to full app</button>
  <div>Prism AAC — Offline Mode</div>
</div>
<script>

['🤗','Excited'],['😐','Bored'],['😟','Worried'],['🥰','Loved'],['😤','Frustrated'],['😳','Embarrassed'],
['🤔','Confused'],['😌','Calm'],['🫣','Shy'],['💪','Proud'],['🥺','Lonely'],['😮','Surprised']]},
{n:'I / You / We',icon:'👤',p:[
['👆','I'],['👉','You'],['👫','We'],['👦','He'],['👧','She'],['👥','They'],
['🙋','Me'],['✋','My'],['👈','Your'],['📍','This'],['👇','That'],['🙋‍♂️','Us']]},

['❤️','Want'],['👍','Like'],['✋','Have'],['⚡','Do'],['💪','Can'],['🙏','Need'],

['❓','How many'],['❓','Which one'],['❓','Can I'],['❓','What is that'],['❓','Where is it'],['❓','When is it']]},

['💧','Water'],['🥛','Milk'],['🧃','Juice'],['🍎','Apple'],['🍌','Banana'],['🍞','Bread'],
['🧀','Cheese'],['🍗','Chicken'],['🍝','Pasta'],['🍕','Pizza'],['🍪','Cookie'],['🍦','Ice cream'],

['📖','Read'],['✏️','Write'],['🔢','Math'],['🎨','Art'],['🎵','Music'],['🏃','Gym'],

['👍','Good'],['👎','Bad'],['📏','Big'],['🤏','Small'],['🔥','Hot'],['🧊','Cold'],
['⬆️','Up'],['⬇️','Down'],['✨','New'],['📦','Old'],['😊','Nice'],['😢','Sad']]},
{n:'Time',icon:'🕐',p:[
['☀️','Morning'],['🌤️','Afternoon'],['🌙','Night'],['📅','Today'],['📅','Tomorrow'],['📅','Yesterday'],
['⏰','Now'],['⏳','Later'],['🔜','Soon'],['✅','Done'],['🔄','Again'],['⏰','What time']]},
{n:'Colors',icon:'🌈',p:[
['🔴','Red'],['🔵','Blue'],['🟢','Green'],['🟡','Yellow'],['🟠','Orange'],['🟣','Purple'],
['⚫','Black'],['⚪','White'],['🟤','Brown'],['💗','Pink'],['🩶','Gray'],['🌈','Rainbow']]},
{n:'Animals',icon:'🐾',p:[
['🐕','Dog'],['🐈','Cat'],['🐟','Fish'],['🐦','Bird'],['🐰','Rabbit'],['🐴','Horse'],
['🐢','Turtle'],['🦋','Butterfly'],['🐘','Elephant'],['🐻','Bear'],['🐒','Monkey'],['🐄','Cow']]},

['☀️','Sunny'],['🌧️','Rainy'],['❄️','Snowy'],['🌬️','Windy'],['☁️','Cloudy'],['⛈️','Stormy'],
['🥶','Cold'],['🥵','Hot'],['🌈','Rainbow'],['☂️','Umbrella'],['🧥','Jacket'],['🌡️','Temperature']]},
{n:'Toys & Fun',icon:'🎮',p:[
['🎮','Play game'],['⚽','Ball'],['🧸','Teddy bear'],['📺','TV'],['🎵','Music'],['📖','Story'],
['🖍️','Draw'],['🧩','Puzzle'],['🎭','Pretend'],['🏊','Swim'],['🚲','Bike'],['🎨','Paint']]},
{n:'Clothes',icon:'👕',p:[
['👕','Shirt'],['👖','Pants'],['👟','Shoes'],['🧦','Socks'],['🧥','Jacket'],['👒','Hat'],
['👗','Dress'],['🩲','Underwear'],['🧤','Gloves'],['🧣','Scarf'],['👓','Glasses'],['🎒','Backpack']]},
{n:'Transport',icon:'🚗',p:[
['🚗','Car'],['🚌','Bus'],['🚂','Train'],['✈️','Airplane'],['🚲','Bicycle'],['🚶','Walk'],
['🚕','Taxi'],['🚢','Boat'],['🏍️','Motorcycle'],['🛴','Scooter'],['🚑','Ambulance'],['🚒','Fire truck']]}
];
// The app injects window.prismOfflineAccess before this script. Without a
// trial or subscription this device may use offline, only the Help / Needs
// safety phrases are shown; they work in every state.
if(window.prismOfflineAccess&&window.prismOfflineAccess.fullBoard===false){
  C=C.filter(function(c){return c.n==='Help / Needs'});
  document.getElementById('note').hidden=false;
}
var cur='',ci=0;
function render(){
  var tb=document.getElementById('tabs'),gr=document.getElementById('grid');
  tb.innerHTML='';gr.innerHTML='';
  C.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='tab'+(i===ci?' active':'');
    b.textContent=c.icon+' '+c.n;
    b.onclick=function(){ci=i;render()};
    tb.appendChild(b);
  });
  C[ci].p.forEach(function(p){
    var b=document.createElement('button');
    b.className='tile';
    b.innerHTML='<span class="e">'+p[0]+'</span>'+p[1];
    b.onclick=function(){say(p[1])};
    gr.appendChild(b);
  });
  tb.children[ci].scrollIntoView({inline:'center',behavior:'smooth'});
}
function speak(t,emergency){
  // The call for help speaks at normal speed so it finishes before it repeats.
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.prismNative){
    window.webkit.messageHandlers.prismNative.postMessage({action:'speak',text:t,lang:'en-US',rate:emergency?1.0:0.4,emergency:!!emergency});
  }else if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.rate=0.8;window.speechSynthesis.speak(u);
  }
}
function say(t){
  cur+=(cur?' ':'')+t;
  var m=document.getElementById('msg');
  m.textContent=cur;m.style.opacity='1';
  speak(t);
}
function speakBar(){
  if(!cur)return;
  speak(cur);
}
// Emergency works offline in every state: it says the call for help aloud,
// again every few seconds, so people nearby hear it. It places no call.
var sosTimer=null,SOS='Emergency. I need help. Please help me.';
function toggleSos(){
  var b=document.getElementById('sos');
  if(sosTimer){
    clearInterval(sosTimer);sosTimer=null;b.textContent='🚨 Emergency';b.setAttribute('aria-label','Emergency: say the call for help aloud');
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.prismNative){
      window.webkit.messageHandlers.prismNative.postMessage({action:'stopSpeech'});
    }else if(window.speechSynthesis){window.speechSynthesis.cancel();}
    return;
  }
  speak(SOS,true);sosTimer=setInterval(function(){speak(SOS,true)},8000);
  b.textContent='■ Stop';b.setAttribute('aria-label','Stop the call for help');
}
render();
</script>
</body>
</html>
