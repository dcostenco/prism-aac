<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Prism AAC — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#14161d;color:#fff;font-family:-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 0;overflow-x:hidden}
.bar{background:#1e2030;border-radius:12px;padding:14px 16px;margin:8px 12px;font-size:20px;min-height:52px;display:flex;align-items:center;gap:8px}
.bar span{flex:1}
.bar .speak{background:#4CAF50;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs{display:flex;overflow-x:auto;gap:4px;padding:4px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#1e2030;border:none;color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.tab.active{background:#4a3f8a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px;overflow-y:auto;max-height:calc(100vh - 180px)}
.tile{background:#1e2030;border-radius:12px;padding:12px 6px;text-align:center;font-size:15px;cursor:pointer;border:none;color:#fff;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile:active{background:#2a3050}
.tile .e{font-size:28px}
.foot{text-align:center;padding:8px;font-size:12px;opacity:0.35}
.foot button{background:#2a3050;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;margin-bottom:4px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="bar">
  <span id="msg" style="opacity:0.5">Tap a phrase to speak</span>
  <button class="speak" onclick="speakBar()">Speak ▶</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="foot">
  <button onclick="location.reload()">🔄 Reconnect to full app</button>
  <div>Prism AAC — Offline Mode</div>
</div>
<script>

['🚕','Taxi'],['🚢','Boat'],['🏍️','Motorcycle'],['🛴','Scooter'],['🚑','Ambulance'],['🚒','Fire truck']]}

var cur='',ci=0;
function render(){
  var tb=document.getElementById('tabs'),gr=document.getElementById('grid');
  tb.innerHTML='';gr.innerHTML='';
  C.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='tab'+(i===ci?' active':'');
    b.textContent=c.icon+' '+c.n;
    b.onclick=function(){ci=i;render()};
    tb.appendChild(b);
  });
  C[ci].p.forEach(function(p){
    var b=document.createElement('button');
    b.className='tile';
    b.innerHTML='<span class="e">'+p[0]+'</span>'+p[1];
    b.onclick=function(){say(p[1])};
    gr.appendChild(b);
  });
  tb.children[ci].scrollIntoView({inline:'center',behavior:'smooth'});
}
function say(t){
  cur+=(cur?' ':'')+t;
  var m=document.getElementById('msg');
  m.textContent=cur;m.style.opacity='1';
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.prismNative){
    window.webkit.messageHandlers.prismNative.postMessage({action:'speak',text:t,lang:'en-US',rate:0.4});
  }else if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.rate=0.8;window.speechSynthesis.speak(u);
  }
}
function speakBar(){
  if(!cur)return;
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.prismNative){
    window.webkit.messageHandlers.prismNative.postMessage({action:'speak',text:cur,lang:'en-US',rate:0.4});
  }else if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(cur);u.rate=0.8;window.speechSynthesis.speak(u);
  }
}
render();
</script>
