name: PrismAAC
options:
  bundleIdPrefix: ai.synalux
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  llama:
    path: _llama_cpp_local

settings:
  SWIFT_VERSION: "5.10"
  ENABLE_BITCODE: NO
  SUPPORTED_PLATFORMS: iphoneos iphonesimulator

targets:

  # ── iPhone / iPad app ──────────────────────────────────────────────────────
  PrismAAC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      CODE_SIGN_STYLE: Automatic
    sources:
      - path: PrismAAC/Sources
        excludes:
          - "**/*.md"
    resources:
      - path: PrismAAC/Assets.xcassets
      - path: PrismAAC/Resources/offline.html
      - path: PrismAAC/Resources/prism-aac-1b7-q8.gguf
    info:
      path: PrismAAC/Info.plist
      properties:
        CFBundleDisplayName: Prism AAC
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "23"
        CFBundleLocalizations:
          - ar
          - de
          - en
          - es
          - fr
          - he
          - hi
          - id
          - it
          - ja
          - ko
          - nl
          - pl
          - pt
          - ro
          - ru
          - fil
          - tr
          - uk
          - vi
          - zh-Hans
          - zh-Hant
          - zh-HK
        UILaunchScreen:
          UIColorName: systemBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Privacy — all required for App Store
        NSMicrophoneUsageDescription: "Prism AAC uses the microphone for voice input so you can speak phrases hands-free."
        NSSpeechRecognitionUsageDescription: "Prism AAC converts your voice to text so you can compose messages by speaking."
        NSContactsUsageDescription: "Prism AAC reads your contacts to find caregivers and emergency contacts for alerts."
        NSCameraUsageDescription: "Prism AAC uses the camera for hands-free head tracking and to create custom picture symbols."
        NSPhotoLibraryUsageDescription: "Prism AAC can import photos from your library to create custom communication pictures."
        NSLocationWhenInUseUsageDescription: "Prism AAC can share your location with emergency contacts when you trigger an SOS alert."
        # Background audio (TTS while app is in background)
        UIBackgroundModes:
          - audio
        # URL schemes
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - prism-aac
              - ai.synalux.prism-aac
        # ATS: RELEASE blocks arbitrary loads; DEBUG exempts localhost for dev server
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PrismAAC/PrismAAC.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.synalux.prism-aac
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "23"
      MARKETING_VERSION: "1.6.0"
      GENERATE_INFOPLIST_FILE: NO
      PRIVACY_INFO_XCPRIVACY_FILE: PrismAAC/PrivacyInfo.xcprivacy
    dependencies:
      - package: llama
        product: llama
      - target: PrismAACWatch
        embed: true

  # ── watchOS 7+ standalone app (no extension target needed) ───────────────
  PrismAACWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    settings:
      DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
      CODE_SIGN_STYLE: Automatic
    sources:
      - path: PrismAACWatch/Sources
        excludes:
          - "**/*.md"
    info:
      path: PrismAACWatch/Info.plist
      properties:
        CFBundleDisplayName: Prism AAC
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "23"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true   # standalone without iPhone
        WKCompanionAppBundleIdentifier: ai.synalux.prism-aac
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Prism AAC uses the microphone for voice dictation."
        NSSpeechRecognitionUsageDescription: "Prism AAC converts your voice to text for hands-free communication."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.synalux.prism-aac.watchkitapp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CURRENT_PROJECT_VERSION: "23"
      MARKETING_VERSION: "1.6.0"
      GENERATE_INFOPLIST_FILE: NO
      SDKROOT: watchos
      SUPPORTED_PLATFORMS: watchos watchsimulator

  # ── Unit tests ──────────────────────────────────────────────────────────────
  PrismAACTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PrismAAC/Tests
        optional: true
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: ai.synalux.prism-aac.tests
    dependencies:
      - target: PrismAAC

  # ── UI tests ─────────────────────────────────────────────────────────────────
  PrismAACUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PrismAACUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: ai.synalux.prism-aac.uitests
      TEST_TARGET_NAME: PrismAAC
    dependencies:
      - target: PrismAAC

schemes:
  PrismAAC:
    build:
      targets:
        PrismAAC: all
    run:
      config: Debug
      simulatorId: 7B34EA17-9CDA-4403-BE92-CF1DAD6D5E1F  # iPhone 17 Pro
    test:
      config: Debug
      targets:
        - PrismAACTests
        - PrismAACUITests

  PrismAACWatch:
    build:
      targets:
        PrismAACWatch: all
    run:
      config: Debug
