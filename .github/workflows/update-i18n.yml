name: Update i18n translations

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_i18n.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate i18n files
        run: python3 scripts/generate_i18n.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: auto-update i18n translations and platform docs"
          git push
