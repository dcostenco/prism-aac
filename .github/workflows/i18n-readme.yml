# Auto-regenerate the 11 translated README landing pages whenever the
# canonical English README.md or scripts/generate_i18n.py changes.
#
# Mirrors the pattern used by the synalux-private repo (sync-docs workflow):
# the canonical content lives in one place (English README), and the
# generator emits the per-language landing pages under docs/i18n/.
# The workflow commits the regenerated files back to the same branch
# so the language bar in README.md never points at stale content.

name: i18n-readme

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_i18n.py'
      - '.github/workflows/i18n-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != null && !contains(github.event.head_commit.message, '[skip-i18n]')
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a deploy-time token so the auto-commit doesn't trigger an
          # infinite loop of i18n-readme runs (the bot's commit pushes
          # without further workflow dispatch by default).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate i18n landing pages
        run: python3 scripts/generate_i18n.py

      - name: Commit regenerated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet docs/i18n; then
            echo "No i18n changes to commit."
            exit 0
          fi
          git add docs/i18n
          git commit -m "docs(i18n): regenerate translations [skip-i18n]" \
                     -m "Auto-generated by .github/workflows/i18n-readme.yml in response to changes under README.md or scripts/generate_i18n.py."
          git push
