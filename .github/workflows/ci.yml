name: CI

# Until this existed, nothing on the GitHub side ran a single test. The green
# checks on a prism-aac PR were CodeQL and a Vercel preview build, and the only
# thing exercising the 5,700-test suite was a pre-push hook installed on one
# maintainer's machine — bypassable with --no-verify, and absent for anyone
# else. A payment path in an app nonspeaking people rely on needs a gate that
# does not depend on who pressed push.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` and not `npm install`: it fails on a lockfile that does not
      # match package.json rather than silently re-resolving, which is what let
      # production build against a tree no commit described. Lockfile guard
      # covers the drift itself.
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      # `npm run lint` is deliberately NOT here. It reports 205 errors on the
      # tree as it stands — no-explicit-any and no-this-alias across the test
      # files, plus vendored wasm-bindgen glue — none of them introduced by any
      # one PR. Gating on it would fail every pull request for reasons its author
      # did not cause, which is the fastest way to teach people that a red check
      # means nothing. It earns a gate after a cleanup pass, not before.
      - name: Tests
        run: npm test
