; Prism AAC — Default Configuration
; This file defines the factory-default settings for the app.

[speech]
rate = 0.5
pitch = 0
volume = 1.0
default_tone = friendly
voice_id =

[language]
code = en

[accessibility]
haptic_enabled = true
audio_feedback_enabled = true
high_contrast_mode = false
font_size = large

[ai]
provider = prism-coder
model = prism-coder:7b
endpoint = http://localhost:11434/api
gemini_api_key =

[subscription]
tier = free
